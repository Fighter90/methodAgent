version: "3.8"

services:
  app:
    build: .
    image: metodagent:latest
    container_name: metodagent
    restart: unless-stopped
    ports:
      - "0.0.0.0:8000:8000"
    env_file:
      - /opt/hackathon/ai.env
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:-}
      LLM_PROVIDERS: ${LLM_PROVIDERS:-cloudru}
      LLM_JUDGE_ENABLED: ${LLM_JUDGE_ENABLED:-true}
      DATA_DIR: /app/data/runtime
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # Примеры кода из лекций исполняются в песочнице внутри контейнера: файловая система только для чтения, без привилегий
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 256
