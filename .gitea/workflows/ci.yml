# CI: тесты с порогом покрытия, линтер, трассировка требований SDD, схема OpenAPI, ESLint, vitest и сборка интерфейса.
# Формат совместим с Gitea Actions и GitHub Actions.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDERS: fixtures
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Зависимости
        run: |
          if [ -f requirements-dev.lock ]; then pip install --require-hashes -r requirements.lock -r requirements-dev.lock
          else pip install -r requirements-dev.txt; fi
      - name: Линтер
        run: ruff check --isolated --select F,E9,I src tests scripts
      - name: Тесты и покрытие (порог в .coveragerc)
        run: pytest -q --cov=src/app --cov-report=term
      - name: Трассировка требований specs/ → тесты
        run: python scripts/spec_trace.py
      - name: Схема OpenAPI docs/openapi.json совпадает с кодом
        run: python scripts/export_openapi.py --check
      - name: Схемы навыков совпадают с моделями
        run: python scripts/export_skill_schemas.py --check
      - name: Ограничения кейса (только Cloud.ru, без чужих SDK)
        run: python scripts/check_constraints.py

  e2e:
    # F17: полный API-регресс на чистой БД с обязательным созданием данных; артефакты — отчёты автопрогона
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      LLM_PROVIDERS: fixtures
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Зависимости
        run: |
          if [ -f requirements-dev.lock ]; then pip install --require-hashes -r requirements.lock -r requirements-dev.lock
          else pip install -r requirements-dev.txt; fi
      - name: Сборка интерфейса
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Сервер на фикстурах и сквозной API-регресс (5 кейсов + роли + выгрузки)
        run: |
          LLM_PROVIDERS=fixtures DATA_DIR=$(mktemp -d) python -m uvicorn app.main:app --port 8765 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8765/health >/dev/null 2>&1 && break; sleep 1; done
          python scripts/autorun.py --url http://127.0.0.1:8765
          python scripts/e2e_regression.py --base http://127.0.0.1:8765 --all-cases
      - name: UI-регресс в браузере (Chromium)
        continue-on-error: true # браузерная часть не блокирует API-приёмку, но артефакты сохраняются
        run: |
          npx playwright install chromium
          BASE_URL=http://127.0.0.1:8765 NODE_PATH=$(npm root -g) SHOTS_DIR=shots node e2e/ui_roles.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: |
            logs/autorun/
            shots/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ESLint, vitest и сборка интерфейса
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run check
